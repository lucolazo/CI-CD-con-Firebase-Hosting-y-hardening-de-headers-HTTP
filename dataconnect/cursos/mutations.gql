# ─────────────────────────────────────────────────────────────────────────────
#  Mutations del conector `cursos`.
# ─────────────────────────────────────────────────────────────────────────────

# Ejemplo resuelto: alta o actualización del perfil del alumno que llama.
# Observá que el cliente solo manda `nombre`:
#   - id_expr: "auth.uid"           → el servidor usa el UID del token
#   - email_expr: "auth.token.email" → el servidor usa el email del token
# Ningún usuario puede crear o modificar el perfil de otro.
mutation UpsertAlumno($nombre: String!) @auth(level: USER) {
  alumno_upsert(data: { id_expr: "auth.uid", nombre: $nombre, email_expr: "auth.token.email" })
}

# L2 · Inscribe AL USUARIO QUE LLAMA en un curso.
#  - @auth(level: USER): exige sesión de Firebase Auth.
#  - alumnoId_expr: "auth.uid": el alumno sale del token; no existe variable para elegirlo,
#    así que nadie puede inscribir a otra persona (sin IDOR).
#  - upsert (no insert): si el par (alumnoId, cursoId) ya existe, la operación no falla ni
#    duplica → idempotente. Con `matricula_insert` la 2.ª llamada violaría la clave primaria
#    compuesta y devolvería error.
#  - `fecha` no se envía: la completa el servidor (request.time) al crear la fila.
mutation Inscribirme($cursoId: UUID!) @auth(level: USER) {
  matricula_upsert(data: { alumnoId_expr: "auth.uid", cursoId: $cursoId })
}

# L5 · Borra la inscripción del usuario que llama en ese curso, y solo esa.
# La clave del delete incluye alumnoId_expr: "auth.uid", así que aunque otro usuario conozca el
# cursoId, solo puede apuntar a SU propia fila (si no existe, no borra nada).
mutation DarmeDeBaja($cursoId: UUID!) @auth(level: USER) {
  matricula_delete(key: { alumnoId_expr: "auth.uid", cursoId: $cursoId })
}
